[package]
name = "flurry"
version = "1.0.0"
authors = ["p222222p222"]
edition = "2021"
rust-version = "1.80"
description = "Живая погода поверх рабочего стола Windows"
license = "MIT"
readme = "README.md"
keywords = ["windows", "overlay", "weather", "snow", "desktop"]
categories = ["gui"]
publish = false
build = "build.rs"

[[bin]]
name = "Flurry"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }

[dependencies.windows]
version = "0.62"
features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_StationsAndDesktops",
  "Win32_Security",
  "Win32_Networking_WinHttp",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
